<title>Sixers Gameday</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700;800&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: one narrow column of three scoreboard panels on a Sixers royal blue with red; single committed look */
:root {
  --bg-top: #006bb6;
  --bg-bot: #001a3a;
  --panel: rgba(0, 18, 44, .6);
  --line: rgba(255, 255, 255, .14);
  --ink: #ffffff;
  --muted: #bccde3;
  --orange: #ed174c;
  --win: #45c97f;
  --loss: #ff6b5b;
  --display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --body: "Barlow", system-ui, -apple-system, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { background: var(--bg-bot); }
html, body { margin: 0; min-height: 100%; }
body {
  background: linear-gradient(180deg, var(--bg-top) 0%, #002b5c 55%, var(--bg-bot) 100%) fixed, var(--bg-bot);
  color: var(--ink); font: 16px/1.4 var(--body); min-height: 100vh;
  padding-top: max(20px, env(safe-area-inset-top, 0px));
  padding-bottom: max(24px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-font-smoothing: antialiased;
}
main { max-width: 460px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 4px 6px; }
h1 { min-width: 0; font: 800 clamp(26px, 8vw, 34px)/1 var(--display); letter-spacing: .03em; text-transform: uppercase; margin: 0; display: flex; align-items: center; gap: 10px; }
h1 img { width: 34px; height: 34px; border-radius: 8px; }
h1 span { background: var(--orange); color: #fff; padding: 2px 8px 0; border-radius: 6px; }
button {
  font: 700 13px var(--body); color: #002b5c; background: #fff; border: 0;
  border-radius: 999px; padding: 8px 14px; cursor: pointer; flex-shrink: 0;
}
button:focus-visible, a:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
.panel { background: var(--panel); border: 1px solid rgba(237,23,76,.7); box-shadow: inset 0 3px 0 var(--orange); border-radius: 14px; padding: 16px; }
.label {
  font: 700 13px var(--display); letter-spacing: .16em; text-transform: uppercase; color: #fff;
  display: flex; align-items: center; gap: 8px; margin-bottom: 10px;
  border-left: 4px solid var(--orange); padding-left: 8px;
}
.live { color: var(--loss); }
.live::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; animation: pulse 1.4s infinite; }
@keyframes pulse { 50% { opacity: .25; } }
@media (prefers-reduced-motion: reduce) { .live::before { animation: none; } }
.board { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; }
.team { display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; min-width: 0; }
.team img { width: 44px; height: 44px; object-fit: contain; }
.team .abbr { font: 700 15px var(--display); letter-spacing: .06em; }
.pts { font: 800 54px/1 var(--display); font-variant-numeric: tabular-nums; }
.dim { color: var(--muted); }
.pts.dim { opacity: .6; color: var(--ink); }
.mid { font: 700 14px var(--display); letter-spacing: .1em; color: var(--muted); text-transform: uppercase; text-align: center; }
.foot { margin-top: 10px; font-size: 14px; color: var(--muted); text-align: center; }
.badge { font: 800 15px var(--display); letter-spacing: .08em; padding: 2px 8px; border-radius: 6px; color: #fff; }
.badge.w { background: var(--win); color: #062a17; } .badge.l { background: var(--loss); color: #3a0a05; }
.record { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.record .big { font: 800 52px/1 var(--display); font-variant-numeric: tabular-nums; }
.record .sub { color: var(--muted); font-size: 15px; }
.next-opp { display: flex; align-items: center; gap: 12px; }
.next-opp img { width: 40px; height: 40px; object-fit: contain; }
.next-opp .who { font: 700 24px/1.1 var(--display); }
.next-opp .when { color: var(--muted); font-size: 15px; }
.watch { margin-top: 14px; display: flex; flex-direction: column; gap: 8px; }
.watch a {
  display: flex; justify-content: space-between; align-items: center; gap: 10px;
  text-decoration: none; color: var(--ink); border: 1px solid rgba(237,23,76,.9); border-radius: 10px; padding: 10px 12px;
  background: rgba(237,23,76,.4);
}
.watch a strong { font-weight: 600; }
.watch a small { color: var(--muted); font-size: 13px; }
.watch a .go { color: #fff; font-weight: 700; font-size: 14px; white-space: nowrap; }
.note { font-size: 13px; color: var(--muted); margin-top: 6px; }
.err { color: #ffd2cc; font-size: 15px; }
.err strong { color: #fff; display: block; margin-bottom: 4px; }
.stamp { text-align: center; font-size: 12px; color: var(--muted); }
</style>
</head>

<span>Now</span></h1>
    <button id="refresh" type="button">Refresh</button>
  </header>

  <section class="panel" id="gamePanel">
    <div class="label" id="gameLabel">Latest game</div>
    <div id="gameBody" class="dim">Loading…</div>
  </section>

  <section class="panel">
    <div class="label">Record</div>
    <div id="recordBody" class="dim">Loading…</div>
  </section>

  <section class="panel">
    <div class="label">Next game</div>
    <div id="nextBody" class="dim">Loading…</div>
  </section>

  <div class="stamp" id="stamp"></div>
</main>

<script>
const BASE = "https://site.api.espn.com/apis/site/v2/sports/basketball/nba";
const TEAM = "phi";           // ESPN slug for the 76ers
const ABBR = "PHI";
const TZ = "America/New_York";
let liveTimer = null;

// ESPN serves the same data from two hosts; try the backup if the first fails
const HOSTS = ["https://site.api.espn.com", "https://site.web.api.espn.com"];
async function getJSON(url) {
  let lastErr;
  for (const host of HOSTS) {
    try {
      const u = url.replace("https://site.api.espn.com", host);
      const r = await fetch(u + (u.includes("?") ? "&" : "?") + "_=" + Date.now(), { cache: "no-store" });
      if (!r.ok) throw new Error("HTTP " + r.status);
      return await r.json();
    } catch (e) { lastErr = e; }
  }
  throw lastErr;
}

function showError(err) {
  const local = !/^https?:$/.test(location.protocol);
  const msg = local
    ? `<strong>Can't get scores from the saved file.</strong>Your iPhone blocks a saved file from reaching the internet. Open this page from its web link instead (the GitHub Pages step) and it will load.`
    : `<strong>Couldn't reach ESPN.</strong>Check your connection and tap Refresh. (${esc(err && err.message || "network error")})`;
  document.getElementById("gameLabel").className = "label";
  document.getElementById("gameLabel").textContent = "Latest game";
  ["gameBody", "recordBody", "nextBody"].forEach((id, i) => {
    const el = document.getElementById(id);
    el.classList.remove("dim");
    el.innerHTML = i === 0 ? `<div class="err">${msg}</div>` : `<span class="dim">Waiting on the connection above.</span>`;
  });
}

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const comp = ev => (ev && ev.competitions && ev.competitions[0]) || {};
const state = ev => ev?.status?.type?.state || comp(ev)?.status?.type?.state || "";
const statusOf = ev => ev?.status || comp(ev)?.status || {};
const isSixers = c => c?.team?.abbreviation === ABBR || c?.team?.slug === "philadelphia-76ers";
const scoreOf = c => {
  if (c?.score == null) return "–";
  return typeof c.score === "object" ? (c.score.displayValue ?? c.score.value ?? "–") : c.score;
};
const logoOf = t => t?.logo || (t?.logos && t.logos[0]?.href) || "";

function fmtDate(iso, withTime = true) {
  const d = new Date(iso);
  const opts = { timeZone: TZ, weekday: "short", month: "short", day: "numeric" };
  if (withTime) { opts.hour = "numeric"; opts.minute = "2-digit"; }
  return d.toLocaleString("en-US", opts) + (withTime ? " ET" : "");
}

function teamCell(c) {
  const t = c.team || {};
  const logo = logoOf(t);
  return `<div class="team">${logo ? `<img src="${esc(logo)}" alt="">` : ""}<span class="abbr">${esc(t.abbreviation || t.shortDisplayName)}</span></div>`;
}

function renderGame(ev, live) {
  const label = document.getElementById("gameLabel");
  const body = document.getElementById("gameBody");
  body.classList.remove("dim");
  if (!ev) { label.textContent = "Latest game"; body.innerHTML = `<span class="dim">No games played yet this season.</span>`; return; }
  const c = comp(ev);
  const cs = c.competitors || [];
  const away = cs.find(x => x.homeAway === "away") || cs[0];
  const home = cs.find(x => x.homeAway === "home") || cs[1];
  const ny = cs.find(isSixers);
  const opp = cs.find(x => x !== ny);
  const st = statusOf(ev);

  if (live) {
    label.className = "label live";
    label.textContent = "Live now";
  } else {
    label.className = "label";
    let badge = "";
    if (ny && opp) {
      let won = ny.winner;
      if (won == null) won = Number(scoreOf(ny)) > Number(scoreOf(opp));
      badge = `<span class="badge ${won ? "w" : "l"}">${won ? "W" : "L"}</span>`;
    }
    label.innerHTML = `Latest game ${badge}`;
  }

  const ptsClass = side => {
    if (live || !ny) return "pts";
    return "pts" + (side === ny ? "" : " dim");
  };
  const mid = live ? esc(st.type?.shortDetail || st.type?.detail || "In progress") : "Final" + (/OT/.test(st.type?.shortDetail || "") ? " / " + esc(st.type.shortDetail.replace(/^Final\/?/, "")) : "");
  body.innerHTML = `
    <div class="board">
      ${teamCell(away)}
      <div class="mid">@</div>
      ${teamCell(home)}
      <div class="${ptsClass(away)}" style="text-align:center">${esc(scoreOf(away))}</div>
      <div class="mid">${mid}</div>
      <div class="${ptsClass(home)}" style="text-align:center">${esc(scoreOf(home))}</div>
    </div>
    <div class="foot">${esc(fmtDate(ev.date, false))}${c.venue?.fullName ? " · " + esc(c.venue.fullName) : ""}</div>`;
}

function renderRecord(teamData, events) {
  const body = document.getElementById("recordBody");
  body.classList.remove("dim");
  const t = teamData?.team || {};
  const items = t.record?.items || [];
  const total = items.find(i => i.type === "total") || items[0];
  const home = items.find(i => i.type === "home");
  const road = items.find(i => i.type === "road" || i.type === "away");
  let summary = total?.summary;

  // Fallback: count completed games from the schedule
  if (!summary && events.length) {
    let w = 0, l = 0;
    events.filter(e => statusOf(e).type?.completed).forEach(e => {
      const ny = (comp(e).competitors || []).find(isSixers);
      if (ny?.winner === true) w++; else if (ny?.winner === false) l++;
    });
    summary = `${w}-${l}`;
  }
  const parts = [];
  if (t.standingSummary) parts.push(esc(t.standingSummary));
  if (home?.summary) parts.push("Home " + esc(home.summary));
  if (road?.summary) parts.push("Road " + esc(road.summary));
  body.innerHTML = `<div class="record"><span class="big">${esc(summary || "0-0")}</span><span class="sub">${parts.join(" · ")}</span></div>`;
}

// Map a TV network to where it streams
function streamFor(name) {
  const n = name.toUpperCase();
  // Sixers local TV is Philly-area only; elsewhere those games are on League Pass
  if (n.includes("NBCSP") || n.includes("NBC SPORTS PHILADELPHIA") || n.includes("NBCS PHILADELPHIA") || n.includes("PHL17") || n.includes("NBCS-PH"))
    return { svc: "NBA League Pass", url: "https://www.nba.com/watch/league-pass-stream", local: true };
  if (n.includes("PEACOCK") || n.includes("NBC")) return { svc: "Peacock", url: "https://www.peacocktv.com/" };
  if (n.includes("PRIME") || n.includes("AMAZON")) return { svc: "Prime Video", url: "https://www.amazon.com/primevideo" };
  if (n.includes("ESPN") || n === "ABC") return { svc: "ESPN app", url: "https://www.espn.com/watch/" };
  if (n.includes("NBA TV")) return { svc: "NBA app (NBA TV)", url: "https://www.nba.com/watch" };
  if (n.includes("MSG")) return { svc: "MSG+ (Gotham Sports app)", url: "https://www.gothamsports.com/" };
  if (n.includes("YES")) return { svc: "Gotham Sports app (YES)", url: "https://www.gothamsports.com/" };
  return null;
}

function networksOf(ev) {
  const c = comp(ev);
  const out = [];
  const add = (name, market) => {
    if (!name) return;
    const m = String(market || "").toLowerCase();
    if (!out.some(o => o.name === name)) out.push({ name, national: m.includes("national") });
  };
  (c.broadcasts || []).forEach(b => {
    if (Array.isArray(b.names)) b.names.forEach(n => add(n, b.market));
    else add(b.media?.shortName || b.media?.name, b.market?.type || b.market);
  });
  (c.geoBroadcasts || []).forEach(g => add(g.media?.shortName, g.market?.type));
  out.sort((a, b) => b.national - a.national);
  return out;
}

function renderNext(ev) {
  const body = document.getElementById("nextBody");
  body.classList.remove("dim");
  if (!ev) { body.innerHTML = `<span class="dim">No upcoming game on the schedule.</span>`; return; }
  const c = comp(ev);
  const cs = c.competitors || [];
  const ny = cs.find(isSixers);
  const opp = cs.find(x => x !== ny) || {};
  const atHome = ny?.homeAway === "home";
  const ot = opp.team || {};
  const logo = logoOf(ot);
  const nets = networksOf(ev);
  
  let watch = "";
  if (nets.length) {
    watch = `<div class="watch">` + nets.map(n => {
      const s = streamFor(n.name);
      const tag = n.national ? "National TV" : "Local TV";
      return s
        ? `<a href="${s.url}" target="_blank" rel="noopener"><span><strong>${esc(s.svc)}</strong><br><small>${esc(n.name)} · ${tag}</small></span><span class="go">Open ›</span></a>`
        : `<a href="https://www.google.com/search?q=${encodeURIComponent(n.name + " streaming")}" target="_blank" rel="noopener"><span><strong>${esc(n.name)}</strong><br><small>${tag}</small></span><span class="go">Find ›</span></a>`;
    }).join("") + `</div>`;
    if (nets.some(n => streamFor(n.name)?.local))
      watch += `<div class="note">Sixers local TV only reaches the Philly area. In New York, stream it on NBA League Pass.</div>`;
  } else {
    watch = `<div class="note">Broadcast not announced yet. Outside the Philly area, non-national Sixers games stream on NBA League Pass.</div>`;
  }

  body.innerHTML = `
    <div class="next-opp">
      ${logo ? `<img src="${esc(logo)}" alt="">` : ""}
      <div style="min-width:0">
        <div class="who">${atHome ? "vs" : "@"} ${esc(ot.displayName || ot.shortDisplayName || "TBD")}</div>
        <div class="when">${esc(fmtDate(ev.date))}${c.venue?.fullName ? " · " + esc(c.venue.fullName) : ""}</div>
      </div>
    </div>${watch}`;
}

async function load() {
  clearTimeout(liveTimer);
  const btn = document.getElementById("refresh");
  btn.textContent = "Updating…";
  try {
    const [teamR, schedR, boardR] = await Promise.allSettled([
      getJSON(`${BASE}/teams/${TEAM}`),
      getJSON(`${BASE}/teams/${TEAM}/schedule`),
      getJSON(`${BASE}/scoreboard`)
    ]);
    if (teamR.status === "rejected" && schedR.status === "rejected") throw teamR.reason;

    let events = schedR.status === "fulfilled" ? (schedR.value.events || []) : [];
    // Early in the year the regular-season list can be empty; fall back to preseason
    if (!events.some(e => statusOf(e).type?.completed) && !events.length) {
      try { events = (await getJSON(`${BASE}/teams/${TEAM}/schedule?seasontype=1`)).events || []; } catch (e) {}
    }
    events.sort((a, b) => new Date(a.date) - new Date(b.date));

    // Live game: prefer today's scoreboard (fresher), else schedule
    const board = boardR.status === "fulfilled" ? (boardR.value.events || []) : [];
    let live = board.find(e => state(e) === "in" && (comp(e).competitors || []).some(isSixers))
            || events.find(e => state(e) === "in");

    const done = events.filter(e => statusOf(e).type?.completed);
    let last = done[done.length - 1];
    // If today's scoreboard has a just-finished 76ers game, use it (scores land there first)
    const boardFinal = board.find(e => statusOf(e).type?.completed && (comp(e).competitors || []).some(isSixers));
    if (boardFinal && (!last || new Date(boardFinal.date) >= new Date(last.date))) last = boardFinal;

    let next = events.find(e => state(e) === "pre" && new Date(e.date) > Date.now() - 3 * 3600e3 && e !== live);
    if (!next && teamR.status === "fulfilled") next = (teamR.value.team?.nextEvent || []).find(e => state(e) === "pre");
    // Board copy of the next game often has better broadcast data
    if (next) {
      const b = board.find(e => e.id === next.id);
      if (b) next = b;
    }

    // Render each card on its own so one bad field can't leave the others stuck on "Loading"
    const safe = (id, fn) => { try { fn(); } catch (e) {
      const el = document.getElementById(id); el.classList.add("dim"); el.textContent = "Couldn't read this part of ESPN's data. Tap Refresh.";
    } };
    safe("gameBody", () => renderGame(live || last, !!live));
    safe("recordBody", () => renderRecord(teamR.status === "fulfilled" ? teamR.value : null, events));
    safe("nextBody", () => renderNext(next));

    document.getElementById("stamp").textContent = "Updated " + new Date().toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" }) + (live ? " · refreshing every 30s" : "");
    if (live) liveTimer = setTimeout(load, 30000);
  } catch (err) {
    showError(err);
  } finally {
    btn.textContent = "Refresh";
  }
}

document.getElementById("refresh").addEventListener("click", load);
// Home-screen apps on iPhone resume instead of reloading, so refresh whenever it comes back into view
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") load(); });
window.addEventListener("pageshow", e => { if (e.persisted) load(); });
load();
</script>
</body>
